# Flywheel: run the regression cases in flywheel/dataset.jsonl on this pull request and on its
# base branch with the scripted model, compare them case by case, and comment the result.
# Keyless: the scripted model needs no secret. Live-model comparisons for prompt and model
# changes are run by hand (flywheel/README.md). Re-resolve an action pin with:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# Flywheel's pin is the commit requirements.txt installs (AgentOps imports flywheel.spend);
# move the two together.
name: flywheel

# A push to main stores main's result, so a pull request reuses it instead of running main
# again. `labeled` re-runs the gate when a person adds flywheel-grading-approved, the label that
# approves a pull request's edits to its own checks.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: muhibm1/flywheel@95340ef71a378ceb15e38a19d6861249cb1fd4f7 # main, 2026-10-25
        with:
          config: flywheel/flywheel.toml
          install: python -m pip install -r requirements.txt && python -m pip install --no-deps -e .

# One live triage call on the dev model, run by hand only. It reads one secret, a key from a
# separate Anthropic test workspace with its own monthly spend limit (docs/hosted-config.md),
# never the app key. ci.yml stays keyless. Re-resolve an action pin with:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
name: live-smoke

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    env:
      AGENTOPS_TEST_ANTHROPIC_API_KEY: ${{ secrets.AGENTOPS_TEST_ANTHROPIC_API_KEY }}
    steps:
      - name: Check the test key is set
        run: |
          if [ -z "${AGENTOPS_TEST_ANTHROPIC_API_KEY// /}" ]; then
            echo "AGENTOPS_TEST_ANTHROPIC_API_KEY is not set; add it under Settings > Secrets and variables > Actions" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Create the virtual environment
        run: python -m venv .venv

      - name: Install pinned requirements
        run: .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Live smoke test
        run: .venv/bin/python -m pytest -q -m live_smoke tests/test_live_smoke.py --junitxml=live.xml

      - name: The smoke test ran
        run: .venv/bin/python scripts/check_test_count.py live.xml 1

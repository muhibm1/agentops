# The action allowlist. Only the actions declared here can ever be proposed to an operator or
# applied; the registry rejects every other name, whatever the model says.
# `target_pattern` is a full-match regular expression for the names an action may be aimed at.
# `verify_window_minutes` (1 to 1440, default 30 when absent) is how long after the incident
# opened verify and the metric preconditions read signals for that action (ADR 0003).
# Each entry is validated at startup by src/agentops/actions/runbook.py; unknown keys fail.
# Changing this file is an ask-first change (CLAUDE.md, Protected).

- action: scale_db_pool
  target_kind: database
  target_pattern: "^postgres$"
  params:
    pool_size: { type: integer, min: 8, max: 128, required: true }
  risk: medium
  preconditions:
    - { check: metric_above, metric: db_pool_utilisation, value: 0.85 }
  dry_run: describe
  rollback:
    action: scale_db_pool
    params_from: previous
    description: Scale the pool back to the size it had before this action.
  idempotent: true

- action: rollback_deploy
  target_kind: deployment
  target_pattern: "^deploy-[0-9]{1,8}$"
  params:
    to_version: { type: string, pattern: "^v[0-9][0-9a-z.-]*$" }
  risk: high
  preconditions:
    - { check: deployment_within_minutes, minutes: 120 }
    - { check: previous_version_available }
  dry_run: describe
  rollback:
    description: Redeploy the version that was rolled back, through the normal release process.
  idempotent: true

- action: circuit_break_dependency
  target_kind: dependency
  target_pattern: "^[a-z0-9-]{1,64}$"
  params:
    fallback: { type: string, pattern: "^[a-z0-9_]+$", required: true }
  risk: medium
  preconditions:
    - { check: dependency_not_healthy }
  dry_run: describe
  rollback:
    description: Close the circuit breaker once the dependency reports healthy again.
  idempotent: true

- action: rerun_partition
  target_kind: job
  target_pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*_(rollup|aggregate|partition|export)$"
  params:
    partition: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", required: true }
  risk: low
  preconditions:
    - { check: metric_below, metric: rows_written, value: 1 }
    - { check: target_named_in_logs }
  dry_run: describe
  rollback:
    description: Nothing to undo; a rerun rewrites the partition in place.
  idempotent: true

- action: pause_batch_job
  target_kind: job
  target_pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*-job(-[a-z0-9]+)*$"
  params: {}
  risk: low
  preconditions:
    - { check: config_true, key: batch_jobs_enabled }
    - { check: target_named_in_logs }
  dry_run: describe
  rollback:
    description: Resume the job once the incident is closed.
  idempotent: true
